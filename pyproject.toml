[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "significantdigits"
version = "0.5.1"
description = "Solid stochastic statistic analysis of Stochastic Arithmetic"
authors = [
    { name = "Verificarlo contributors", email = "verificarlo@googlegroups.com" },
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    # Shields.io renders the "Python versions" badge from these classifiers,
    # not from requires-python, so keep them in sync with the CI matrix.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Development Status :: 4 - Beta",
]
license = { file = "LICENSE" }
# Only what `import significantdigits` actually needs. The test and docs
# tooling lives in the dev dependency-group below so it is not imposed as a
# runtime constraint on downstream users.
dependencies = [
    "icecream>=2.1.3",
    "numpy>=1.22.0",
    "scipy>=1.7.3",
]

[project.optional-dependencies]
# GPU backend; pick the CuPy wheel matching your CUDA toolkit,
# e.g. 'pip install significantdigits[gpu-cuda11x]' for CUDA 11.x
gpu = ["cupy-cuda12x>=12.0"]
gpu-cuda12x = ["cupy-cuda12x>=12.0"]
gpu-cuda11x = ["cupy-cuda11x>=12.0"]

[dependency-groups]
dev = [
    "pdoc>=14.2.0",
    "pytest>=6.2.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/significantdigits"]

[tool.hatch.build]
exclude = ["pdoc/", ".github/", "*.md"]

[project.scripts]
significantdigits = "significantdigits.__main__:main"


[project.urls]
"Bug Tracker" = "https://github.com/verificarlo/significantdigits/issues"
