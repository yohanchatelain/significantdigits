version: 2
updates:
  # Keep uv.lock current. Security advisories against the lockfile are only
  # actionable if something bumps the pins, so let Dependabot open the PRs.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR per week for routine bumps; security fixes still get their own.
      all-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
